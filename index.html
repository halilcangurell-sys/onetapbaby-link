<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Tap Baby</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap">
<style>
/* Layout: one narrow centered column. Brand tile, name, line, two store buttons, a phone peeking from below, three facts. */
:root{
  --bg:#F5EFFA; --fg:#24133A; --muted:#66567B; --card:#FFFFFF; --line:#E2D7EE;
  --brand:#5B2291; --on-brand:#FFFFFF; --warm:#C9622E; --glow:rgba(201,98,46,.16);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B0935; --fg:#F6EDFB; --muted:#BBA9D1; --card:#2A1250; --line:#3D2268;
  --brand:#FFBE8C; --on-brand:#2A1240; --warm:#FFBE8C; --glow:rgba(201,98,46,.30); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B0935; --fg:#F6EDFB; --muted:#BBA9D1; --card:#2A1250; --line:#3D2268;
  --brand:#FFBE8C; --on-brand:#2A1240; --warm:#FFBE8C; --glow:rgba(201,98,46,.30); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:32px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;display:flex;flex-direction:column;background-image:radial-gradient(520px 360px at 50% 100%,var(--glow),transparent 70%);background-repeat:no-repeat}
main{max-width:440px;width:100%;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.store:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.logo{width:96px;height:96px;border-radius:24px;box-shadow:0 14px 34px rgba(60,20,100,.28)}
h1{font-weight:900;font-size:clamp(34px,9vw,44px);letter-spacing:-.025em;line-height:1.05;margin:20px 0 0;text-wrap:balance}
.tag{font-size:19px;font-weight:700;margin:12px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:8px 0 0;max-width:34ch;text-wrap:balance}
.stores{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:26px}
.store{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 18px;min-height:68px}
.store svg{flex:none;width:26px;height:26px}
.store b{display:block;font-size:18px;line-height:1.2}
.store span{display:block;font-size:13px;color:var(--muted)}
.store i{margin-left:auto;font-style:normal;font-weight:900;font-size:20px;color:var(--warm)}
.store.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.store.primary span{color:var(--on-brand);opacity:.8}
.store.primary i{color:var(--on-brand)}
.store:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:no-preference){.store{transition:transform .15s}}
</style>
</head>
